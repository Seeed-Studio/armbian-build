# Seeed Studio Rockchip RK3576 octa core 4/8/16GB RAM SoC
BOARD_NAME="reComputer RK3576 Devkit"
BOARDFAMILY="rk35xx"
BOOT_SOC="rk3576"
BOARD_MAINTAINER="Pillar1989"
BOARD_VENDOR="seeed-studio"
INTRODUCED="2025"
BOOTCONFIG="recomputer-rk3576-devkit_defconfig"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3576-recomputer-rk3576-devkit.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
IMAGE_PARTITION_TABLE="gpt"
OTA_ENABLE="yes"
SERIALCON="ttyFIQ0,ttyGS0"
BT_UART="/dev/ttyS4"
PACKAGE_LIST_BOARD="net-tools rfkill pulseaudio-module-bluetooth fail2ban"
AIC8800_TYPE="sdio"
enable_extension "radxa-aic8800"

source "${SRC}/config/sources/vendors/seeed-studio/recomputer-rk35xx-common.inc"

function post_family_config__recomputer_rk3576_devkit_use_seeed_bootscript() {
	display_alert "$BOARD" "Using Seeed bootscript: boot-seeed-rk3576.cmd -> boot.cmd" "info"
	declare -g BOOTSCRIPT="boot-seeed-rk3576.cmd:boot.cmd"
}

# Install Mali-G52 userspace library for GPU hardware acceleration
# Kernel DDK is g25p0; g24p0 userspace library is ABI-compatible
function pre_install_distribution_specific__recomputer_rk3576_install_libmali() {
	display_alert "Installing Mali GPU libraries from APT repo" "libmali-g52" "info"

	seeed_recomputer_install_from_apt libmali-bifrost-g52-g24p0-x11-wayland-gbm
	chroot_sdcard ldconfig

	display_alert "Mali GPU libraries installed successfully" "libmali-g52" "info"
}

# Install camera engine rkaiq for Rockchip ISP
function pre_install_distribution_specific__recomputer_rk3576_install_camera_engine() {
	display_alert "Installing camera engine from APT repo" "camera-engine-rkaiq" "info"

	seeed_recomputer_install_from_apt camera-engine-rkaiq-rk3576

	display_alert "Camera engine installed successfully" "camera-engine-rkaiq" "info"
}

# Audio naming: HDMI0, DP0, ES8311
function post_family_tweaks__recomputer_rk3576_naming_audios() {
	display_alert "$BOARD" "Renaming recomputer-rk3576-devkit audios" "info"

	mkdir -p "${SDCARD}/etc/udev/rules.d/"
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi0-sound", ENV{SOUND_DESCRIPTION}="HDMI0 Audio"' > "${SDCARD}/etc/udev/rules.d/90-naming-audios.rules"
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-dp0-sound", ENV{SOUND_DESCRIPTION}="DP0 Audio"' >> "${SDCARD}/etc/udev/rules.d/90-naming-audios.rules"
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-es8311-sound", ENV{SOUND_DESCRIPTION}="ES8311 Audio"' >> "${SDCARD}/etc/udev/rules.d/90-naming-audios.rules"
}

# DMA heap permissions — Mali GBM needs access to /dev/dma_heap/* devices.
# Without this, Mali gbm_create_device fails with ENOENT for non-root users.
function post_family_tweaks__recomputer_rk3576_dma_heap_permissions() {
	display_alert "$BOARD" "Setting DMA heap permissions for Mali GPU" "info"

	mkdir -p "${SDCARD}/etc/udev/rules.d/"
	echo 'SUBSYSTEM=="dma_heap", MODE="0666"' > "${SDCARD}/etc/udev/rules.d/50-mali-dma-heap.rules"
}

# X11 config — use OutputClass to match rockchip DRM driver as primary GPU.
# card0 is NPU (rknpu), card1 is display-subsystem (rockchip).
# OutputClass with MatchDriver "rockchip" ensures Xorg selects card1 as primary.
# glamor falls back to ShadowFB automatically (Mali EGL cannot use Mesa GBM).
# DP/DSI resolution is handled at runtime by dp-dsi-resolve script.
function post_family_tweaks__recomputer_rk3576_x11_kms_config() {
	display_alert "$BOARD" "Configuring X11 for Rockchip KMS" "info"

	mkdir -p "${SDCARD}"/etc/X11/xorg.conf.d/
	cat > "${SDCARD}"/etc/X11/xorg.conf.d/10-rockchip-kms.conf <<-'EOF'
Section "OutputClass"
    Identifier  "RockchipDRM"
    MatchDriver "rockchip"
    Driver      "modesetting"
    Option      "PrimaryGPU"     "yes"
EndSection
EOF
}

# Dynamic DP resolution: when DSI panel is connected alongside DP and HDMI,
# VOP bandwidth may be exceeded.  This script calculates used bandwidth from
# HDMI and DSI, finds the best DP mode within remaining budget, and monitors
# DSI status for rollback when DSI disconnects.  Supports both xrandr (X11)
# and wlr-randr (Wayland) with automatic compositor detection and retry.
function post_family_tweaks__recomputer_rk3576_dp_dsi_autoswitch() {
	display_alert "$BOARD" "Installing DP/DSI resolution auto-switch" "info"

	install -d -m 0755 "${SDCARD}"/usr/local/bin
	cat > "${SDCARD}"/usr/local/bin/dp-dsi-resolve <<-'SCRIPT'
#!/bin/sh
# dp-dsi-resolve: dynamically adjust DP resolution based on VOP bandwidth.
# Calculates total scanout bandwidth (HDMI + DSI), finds the best DP mode
# within remaining budget, applies DSI landscape rotation, and monitors
# DSI/DP connector status for reconfiguration.

LOG="/tmp/dp-dsi-resolve.log"
BW_BUDGET=240  # Empirical MPix/s budget for RK3576 DDR scanout (3-output)
DSI_ROTATE="right"  # DSI panel is physically landscape, native mode is portrait
DP_RATE=50  # Limit DP to 50Hz to avoid DW-DP FIFO overflow on boot

log() { echo "$(date '+%Y-%m-%d %H:%M:%S') $*" >> "$LOG"; }

# --- Sysfs helpers ---
get_status() {
	for f in /sys/class/drm/card*-"$1"/status; do
		[ -f "$f" ] && cat "$f" 2>/dev/null && return
	done
}

get_preferred_mode() {
	for f in /sys/class/drm/card*-"$1"/modes; do
		[ -f "$f" ] && head -1 "$f" 2>/dev/null && return
	done
}

# Parse "WxH" string → MPix/s at 60Hz
mode_to_mpxs() {
	local mode="$1"
	local w="${mode%%x*}"
	local h="${mode##*x}"
	h="${h%%[ip]*}"
	[ -n "$w" ] && [ -n "$h" ] && echo $(( w * h * 60 / 1000000 )) || echo 0
}

# Check if mode is landscape (width >= height)
is_landscape() {
	local mode="$1"
	local w="${mode%%x*}"
	local h="${mode##*x}"
	h="${h%%[ip]*}"
	[ -n "$w" ] && [ -n "$h" ] && [ "$w" -ge "$h" ]
}

# Find highest landscape DP mode within bandwidth budget
find_best_dp_mode() {
	local budget="$1" best="" best_mpxs=0
	for f in /sys/class/drm/card*-DP-1/modes; do
		[ -f "$f" ] || continue
		while IFS= read -r mode; do
			is_landscape "$mode" || continue
			local mpxs
			mpxs=$(mode_to_mpxs "$mode")
			if [ "$mpxs" -le "$budget" ] && [ "$mpxs" -gt "$best_mpxs" ]; then
				best="$mode"
				best_mpxs=$mpxs
			fi
		done < "$f"
		break
	done
	echo "${best:-1280x720}"
}

# Apply display layout via xrandr (X11) or wlr-randr (Wayland)
# DSI is always rotated to landscape; uses --right-of for positioning
apply_layout() {
	local dp_mode="$1" dsi_connected="$2"

	if [ -n "$WAYLAND_DISPLAY" ] && command -v wlr-randr >/dev/null 2>&1; then
		local res
		res=$(echo "$dp_mode" | sed 's/[ip].*//')
		wlr-randr --output DP-1 --mode "$res" --custom-mode "${res}@${DP_RATE}Hz" 2>>"$LOG"
		return
	fi

	if [ -z "$DISPLAY" ] || ! command -v xrandr >/dev/null 2>&1; then
		return 1
	fi

	local dp_res
	dp_res=$(echo "$dp_mode" | sed 's/[ip].*//')
	local cmd="xrandr --output HDMI-1 --primary --auto"

	if [ "$dsi_connected" = "yes" ]; then
		cmd="$cmd --output DP-1 --mode $dp_res --rate $DP_RATE --right-of HDMI-1"
		cmd="$cmd --output DSI-1 --auto --right-of DP-1 --rotate $DSI_ROTATE"
	else
		cmd="$cmd --output DSI-1 --off"
		cmd="$cmd --output DP-1 --mode $dp_res --rate $DP_RATE --right-of HDMI-1"
	fi

	log "  running: $cmd"
	$cmd 2>>"$LOG"

	# Re-apply DSI rotation separately (X may ignore --rotate during hotplug)
	if [ "$dsi_connected" = "yes" ]; then
		sleep 1
		xrandr --output DSI-1 --rotate $DSI_ROTATE 2>>"$LOG"
	fi

	# Re-apply DP mode separately to resolve FIFO overflow
	# (occurs on both reboot and hotplug due to DW-DP controller timing)
	sleep 1
	xrandr --output DP-1 --mode $dp_res --rate $DP_RATE 2>>"$LOG"
}

# --- Core resolve logic ---
resolve() {
	local dsi_status dp_status
	dsi_status=$(get_status "DSI-1")
	dp_status=$(get_status "DP-1")
	log "resolve: DSI=$dsi_status DP=$dp_status"

	[ "$dp_status" = "connected" ] || return 0

	local target dsi_yes="no"
	if [ "$dsi_status" = "connected" ]; then
		dsi_yes="yes"
		local used=0
		local hdmi_status
		hdmi_status=$(get_status "HDMI-A-1")
		if [ "$hdmi_status" = "connected" ]; then
			local hdmi_mode
			hdmi_mode=$(get_preferred_mode "HDMI-A-1")
			if [ -n "$hdmi_mode" ]; then
				used=$((used + $(mode_to_mpxs "$hdmi_mode")))
				log "  HDMI=$hdmi_mode ($(mode_to_mpxs "$hdmi_mode")MPix/s)"
			fi
		fi
		local dsi_mode
		dsi_mode=$(get_preferred_mode "DSI-1")
		if [ -n "$dsi_mode" ]; then
			used=$((used + $(mode_to_mpxs "$dsi_mode")))
			log "  DSI=$dsi_mode ($(mode_to_mpxs "$dsi_mode")MPix/s)"
		else
			used=$((used + $(mode_to_mpxs "720x1280")))
			log "  DSI=720x1280 (fallback, $(mode_to_mpxs "720x1280")MPix/s)"
		fi
		local available=$((BW_BUDGET - used))
		log "  used=${used}MPix/s DP_budget=${available}MPix/s"
		target=$(find_best_dp_mode "$available")
		log "  best DP mode=$target"
	else
		target="preferred"
		log "  DSI absent, restore preferred"
	fi

	apply_layout "$target" "$dsi_yes"
	return $?
}

# --- Notify user ---
notify() {
	local title="$1" body="$2"
	if command -v notify-send >/dev/null 2>&1; then
		notify-send -i display "$title" "$body" 2>/dev/null &
	fi
}

# --- Entry point ---
log "=== dp-dsi-resolve started ==="
log "DISPLAY=${DISPLAY:-none} WAYLAND=${WAYLAND_DISPLAY:-none} USER=$(whoami)"

# Wait for compositor with retry
attempt=0
while [ "$attempt" -lt 15 ]; do
	attempt=$((attempt + 1))
	has_x11="${DISPLAY:+yes}"
	has_wl="${WAYLAND_DISPLAY:+yes}"
	if [ "$has_x11" ] || [ "$has_wl" ]; then
		if resolve; then
			log "Resolved successfully (attempt $attempt)"
			break
		fi
	fi
	log "Waiting for compositor... (attempt $attempt)"
	sleep 1
done

# Notify if DP was lowered
dsi_now=$(get_status "DSI-1")
if [ "$dsi_now" = "connected" ] && [ "$(get_status "DP-1")" = "connected" ]; then
	notify "DP Resolution Adjusted" "DP lowered to accommodate DSI panel (VOP bandwidth constraint)"
fi

# Fork background monitor for connector changes
(
	log "Monitor started (PID $$)"
	last_dsi=$(get_status "DSI-1")
	last_dp=$(get_status "DP-1")
	while true; do
		sleep 2
		current_dsi=$(get_status "DSI-1")
		current_dp=$(get_status "DP-1")
		if [ "$current_dsi" != "$last_dsi" ] || [ "$current_dp" != "$last_dp" ]; then
			log "Connector changed: DSI=$last_dsi→$current_dsi DP=$last_dp→$current_dp"
			last_dsi="$current_dsi"
			last_dp="$current_dp"
			if resolve; then
				log "Reconfigured"
				[ "$current_dsi" != "connected" ] && \
					notify "DP Resolution Restored" "DSI disconnected, DP restored to preferred mode"
			fi
		fi
		# Check DSI rotation (display settings or other tools may reset it)
		if [ "$current_dsi" = "connected" ] && [ -n "$DISPLAY" ]; then
			dsi_line=$(xrandr --query 2>/dev/null | grep 'DSI-1 connected')
			case "$dsi_line" in
				*" right ("*) ;;  # correct
				*) log "DSI rotation lost, re-applying"; resolve ;;
			esac
		fi
	done
) &

log "Initial setup complete"
SCRIPT
	chmod 755 "${SDCARD}"/usr/local/bin/dp-dsi-resolve

	install -d -m 0755 "${SDCARD}"/etc/xdg/autostart
	cat > "${SDCARD}"/etc/xdg/autostart/dp-dsi-resolve.desktop <<-'EOF'
[Desktop Entry]
Type=Application
Name=DP/DSI Resolution Switch
Exec=/usr/local/bin/dp-dsi-resolve
X-GNOME-Autostart-enabled=true
Hidden=false
EOF
}

# Configure GDM — force X11 because Mutter 46 Wayland SIGSEGV with Mali blob.
# Mutter's GBM renderer is incompatible with Mali's EGL implementation,
# causing DATA_INVALID_FAULT and window scaling artifacts.
function post_family_tweaks__recomputer_rk3576_gdm_config() {
	display_alert "$BOARD" "Configuring GDM for X11" "info"

	mkdir -p "${SDCARD}"/etc/gdm3/
	cat > "${SDCARD}"/etc/gdm3/custom.conf <<-'EOF'
[daemon]
WaylandEnable=false

[security]

[xdmcp]

[chooser]

[debug]
EOF
}

# Disable suspend and hibernation
function post_family_tweaks__recomputer_rk3576_disable_suspend() {
	display_alert "$BOARD" "Disabling suspend and hibernation" "info"

	mkdir -p "${SDCARD}"/etc/systemd/sleep.conf.d
	cat > "${SDCARD}"/etc/systemd/sleep.conf.d/nosuspend.conf <<-'EOF'
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
EOF
}

# Mali EGL: replace libglvnd's libEGL/libGLESv2 with direct Mali symlinks.
# The Mali blob provides its own EGL/GLES implementation. libglvnd's ELF files
# (libEGL.so.1.1.0, libGLESv2.so.2.1.0) must be moved out of ldconfig's scan
# path because ldconfig rebuilds symlinks from SONAME metadata embedded in the
# ELF files, which would overwrite our Mali symlinks.
# Also installs the Mali EGL vendor JSON so libglvnd-aware apps can discover Mali.
# Must run after all packages are installed.
function post_family_tweaks__recomputer_rk3576_mali_egl_override() {
	display_alert "$BOARD" "Replacing libglvnd EGL/GLES with Mali" "info"
	local LIB_DIR="${SDCARD}/usr/lib/aarch64-linux-gnu"

	# Move libglvnd ELF files out of ldconfig scan path
	mkdir -p "${LIB_DIR}/_disabled"
	for f in libEGL.so.1.1.0 libGLESv2.so.2.1.0; do
		if [[ -f "${LIB_DIR}/${f}" ]]; then
			mv "${LIB_DIR}/${f}" "${LIB_DIR}/_disabled/"
		fi
	done

	# Replace soname symlinks with direct Mali links
	for f in libEGL.so.1 libGLESv2.so.2; do
		rm -f "${LIB_DIR}/${f}"
		ln -sf libmali.so.1 "${LIB_DIR}/${f}"
	done

	# Install Mali EGL vendor JSON (alongside Mesa's) for libglvnd-aware apps
	mkdir -p "${SDCARD}"/usr/share/glvnd/egl_vendor.d/
	cat > "${SDCARD}"/usr/share/glvnd/egl_vendor.d/00_mali.json <<-'EOF'
{
    "file_format_version" : "1.0.0",
    "ICD" : {
        "library_path" : "libEGL.so.1"
    }
}
EOF

	# Remove any mali/ subdirectory and ldconfig conf from previous approaches
	rm -rf "${LIB_DIR}/mali"
	rm -f "${SDCARD}"/etc/ld.so.conf.d/00-aarch64-mali.conf

	# Restore Mesa libgbm — the libmali deb ships mali/libgbm.so.1 and an
	# ldconfig conf that causes libgbm.so.1 to resolve to the Mali blob.
	# Mali's GBM writes XBGR pixels but the VOP only supports XRGB8888,
	# which inverts red/blue on all outputs (HDMI, DSI, DP).  Force Mesa.
	if [[ -f "${LIB_DIR}/libgbm.so.1.0.0" ]]; then
		rm -f "${LIB_DIR}/libgbm.so.1"
		ln -sf libgbm.so.1.0.0 "${LIB_DIR}/libgbm.so.1"
	fi

	chroot_sdcard ldconfig
}

# Keep the real libmali-hook from the deb package.
# The hook intercepts specific Mali calls for compatibility with SDK applications.
function post_family_tweaks__recomputer_rk3576_mali_hook() {
	local HOOK_DIR="${SDCARD}/usr/lib/aarch64-linux-gnu"
	local DISABLED_DIR="${HOOK_DIR}/_disabled"

	# Restore real hook files from _disabled/ if they were moved by a previous build
	if [[ -d "${DISABLED_DIR}" ]]; then
		for f in libmali-hook.so.1.9.0 libmali-hook-injector.a; do
			if [[ -f "${DISABLED_DIR}/${f}" ]] && [[ ! -f "${HOOK_DIR}/${f}" ]]; then
				mv "${DISABLED_DIR}/${f}" "${HOOK_DIR}/"
			fi
		done
	fi

	# Remove compiled stub if present (from old build approach)
	if [[ -f "${HOOK_DIR}/libmali-hook.so.1" ]] && [[ ! -L "${HOOK_DIR}/libmali-hook.so.1" ]]; then
		rm -f "${HOOK_DIR}/libmali-hook.so.1"
	fi

	# Ensure soname symlink points to the real hook
	if [[ -f "${HOOK_DIR}/libmali-hook.so.1.9.0" ]]; then
		rm -f "${HOOK_DIR}/libmali-hook.so.1" "${HOOK_DIR}/libmali-hook.so"
		ln -sf libmali-hook.so.1.9.0 "${HOOK_DIR}/libmali-hook.so.1"
		ln -sf libmali-hook.so.1 "${HOOK_DIR}/libmali-hook.so"
	fi
}
